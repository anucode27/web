<!DOCTYPE html>
<html>

<head>

    <title>Color Keywords Demo</title>

    <style>

        .keyword-algo {
            color: #dc2626;
            font-weight: bold;
        }

        .keyword-db {
            color: #2563eb;
            font-weight: bold;
        }

        .keyword-ai {
            color: #059669;
            font-weight: bold;
        }

        .keyword-wt {
            color: #7c3aed;
            font-weight: bold;
        }

        .highlight {
            background-color: #fef3c7;
            padding: 2px 4px;
            border-radius: 3px;
        }

    </style>

</head>

<body>

    <h1>Computer Science - Key Domains</h1>

    <p>
        We study
        <span class="keyword-algo">
            Data Structures and Algorithms
        </span>
        for efficient problem solving,

        <span class="keyword-db">
            Database Management Systems
        </span>
        for data storage,

        <span class="keyword-ai">
            Artificial Intelligence
        </span>
        for intelligent systems and

        <span class="keyword-wt">
            Web Technologies
        </span>
        for full-stack development.
    </p>

    <p>
        <span class="highlight">
            Keywords are color-coded
        </span>
        for quick scanning.
    </p>

</body>

</html>
