<!DOCTYPE html>
<html>
<head>
    <title>20% - 60% - 20% Layout</title>

    <style>
        body {
            margin: 0;
        }

        .container {
            display: grid;
            grid-template-columns: 20% 60% 20%;
            height: 100vh;
        }

        .left {
            background-color: #fde68a;
            padding: 20px;
        }

        .center {
            background-color: white;
            padding: 20px;
        }

        .right {
            background-color: #bfdbfe;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="left">
            <h3>Left 20%</h3>
            <p>Navigation / Index</p>
        </div>

        <div class="center">
            <h2>Center 60%</h2>
            <p>Main Content Area</p>
        </div>

        <div class="right">
            <h3>Right 20%</h3>
            <p>Ads / Notices</p>
        </div>

    </div>

</body>
</html>
